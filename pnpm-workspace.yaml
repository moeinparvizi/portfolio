packages:
  - 'apps/*'
# Keep runtime symlink targets inside the backend service's deployment boundary.
virtualStoreDir: apps/backend/node_modules/.pnpm
allowBuilds:
  '@parcel/watcher@2.5.6': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  'esbuild@0.28.1': true
  'lmdb@3.5.1': true
  'msgpackr-extract@3.0.4': true
  prisma: true
  puppeteer: true
  unrs-resolver: true
